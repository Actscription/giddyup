<script>
const {createElement:h,useState,useRef,useCallback,useEffect,Fragment}=React;
const FACTOR_GROUPS=[

    {id:"trainer",label:"Trainer",icon:"🎯",tip:"Trainer win % & patterns"},

  ]},
  {id:"race",label:"Race Conditions",icon:"🏟",factors:[
    {id:"distance",label:"Distance",icon:"📏",tip:"Distance history & fit"},
    {id:"track",label:"Track / Surface",icon:"🏟",tip:"Surface preference & record"},
    {id:"post",label:"Post Position",icon:"🎰",tip:"Starting gate advantage"},

    {id:"equipment",label:"Equipment Changes",icon:"🔧",tip:"Blinkers, tongue tie etc."},
    {id:"pedigree",label:"Pedigree",icon:"🧬",tip:"Breeding & distance suitability"},
    {id:"style",label:"Running Style",icon:"💨",tip:"Front runner, closer, stalker"},
    {id:"combo",label:"Trainer/Jockey Combo",icon:"🤝",tip:"Combined win rate together"},
    {id:"bias",label:"Track Bias",icon:"📐",tip:"Rail, speed or post bias today"},
  ]},

const ALL_FACTORS=FACTOR_GROUPS.flatMap(g=>g.factors);
// Glossary — full explanations shown when a user taps a factor name (vs. the
// short "tip" above, which is just a label-line hint).
const GLOSSARY={
  speed:"How fast the horse has actually run, adjusted for track and distance, so runs at different tracks can be compared apples-to-apples. The single most reliable number for separating true class from hype — especially in Stakes and Allowance company where the field has already been sorted by ability.",
  form:"How the horse has been running lately — usually its last 3-5 starts. Strong recent form suggests the horse is sharp and peaking; a string of flat efforts is a warning sign even if the horse won impressively months ago.",
  jockey:"The rider's skill and recent win rate. A great horse can lose to poor decision-making in the saddle — a bad break, wrong position, mistimed move — so a proven rider is real insurance, especially in a competitive or crowded field.",
  trainer:"The trainer's win percentage and how they campaign horses — especially their pattern with horses moving up or down in class, or returning from a layoff. Some trainers are known for a specific angle, like first-off-the-claim or blinkers-on, worth knowing.",
  earnings:"Recent money earned per start compared to the rest of the field — a good proxy for how competitive the horse has actually been, not just how many races it's won. Padded earnings against weak fields count for less than earnings against real competition.",
  distance:"How the horse has performed at this exact distance before, and whether today's trip suits its running style. Stretching a proven sprinter out to two turns, or cutting a router back to a sprint, is one of the most common reasons a good horse underperforms.",
  track:"The horse's record on today's surface — dirt, turf, or synthetic — and track configuration. Some horses are proven on the turf or in the slop while others have never handled a particular surface well, regardless of their overall ability.",
  post:"The advantage or disadvantage of the starting gate position. Inside posts can save ground but risk traffic trouble; outside posts avoid trouble but cover more ground — the ideal post depends on running style, field size, and today's track bias.",
  class:"Whether the horse is stepping up or dropping down in claiming price or race grade. This is one of the loudest signals a trainer sends — a drop in class often means the barn wants an easier spot, while stepping up shows real confidence.",
  days:"How long since the horse's last race. Too long off and a horse may be rusty; too many quick turnarounds and it may be feeling the effects of a hard campaign. The ideal spacing depends on the individual horse and trainer's pattern.",
  weight:"The actual weight the horse carries today, including the jockey and equipment. A few extra pounds matters more over longer distances, and apprentice ('bug') riders can offer meaningful weight relief.",
  workouts:"Recent workout times leading up to the race — a window into current fitness, especially for horses coming off a layoff or making their first start, where there's little or no race form to go on.",
  equipment:"Changes like blinkers going on or off, or a first-time Lasix. Trainers make these changes deliberately to fix a specific issue — blinkers on often means 'we want this horse focused,' which is worth paying attention to.",
  pedigree:"The horse's breeding, and what it suggests about stamina and surface preference — especially valuable for young or lightly-raced horses trying a new distance or surface for the first time, where there's no proven form to rely on.",
  style:"Whether the horse is a front-runner, stalker, or closer. Matching running style to the shape of the race — how much pace is likely up front — is one of the most overlooked handicapping skills; a closer needs a fast pace to run into, a lone speed horse wants a slow one.",
  combo:"How often this specific trainer-jockey pairing wins together, separate from either one's overall numbers. Some combinations just click — certain trainers consistently give their live horses to the same rider.",
  bias:"Whether the track is playing favorably toward certain posts, running styles, or parts of the strip today — inside speed, outside closers, and so on. Bias can shift race to race depending on maintenance and weather, so it's the least stable factor here, but can be decisive on the right day.",
};
function FactorInfoModal({factor,onClose}){
  if(!factor)return null;
  return h("div",{onClick:onClose,style:{position:"fixed",inset:0,background:"rgba(15,23,42,0.55)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:20}},
    h("div",{onClick:e=>e.stopPropagation(),style:{background:"#fff",borderRadius:16,padding:"20px 20px 16px",maxWidth:380,width:"100%",boxShadow:"0 12px 40px rgba(0,0,0,0.3)"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
        h("span",{style:{fontSize:22}},factor.icon),
        h("span",{style:{fontSize:16,fontWeight:800,color:C.navy}},factor.label)),
      h("div",{style:{fontSize:13.5,color:"#334155",lineHeight:1.6,marginBottom:16}},GLOSSARY[factor.id]||factor.tip),
      h("button",{onClick:onClose,style:{width:"100%",padding:"9px 0",borderRadius:10,border:"none",background:"linear-gradient(135deg,"+C.navy+","+C.navy2+")",color:C.gold,fontWeight:700,fontSize:13,cursor:"pointer"}},"Got it")));
}
// Usernames allowed to publish the daily card (lowercase)
const GIDDYUP_ADMIN_USERNAMES=["inthemoney"];
// Rank-based Angle Points: user ranks each of the 17 factors 1 (most important) to 17
// (least important), and this table converts rank -> points. Sums to exactly 100.
const RANK_POINTS=[11,10,10,9,8,8,7,7,6,5,5,4,3,3,2,1,1];
const DEFAULT_RANKS=Object.fromEntries(ALL_FACTORS.map((f,i)=>[f.id,i+1]));
function ranksToWeights(ranksMap){const w={};ALL_FACTORS.forEach(f=>{const r=Math.max(1,Math.min(17,ranksMap[f.id]||17));w[f.id]=RANK_POINTS[r-1];});return w;}
function weightsToRanks(weights){const sorted=[...ALL_FACTORS].sort((a,b)=>(weights[b.id]||0)-(weights[a.id]||0));const r={};sorted.forEach((f,i)=>{r[f.id]=i+1;});return r;}
function orderFromRanks(ranksMap){const arr=new Array(17);ALL_FACTORS.forEach(f=>{arr[Math.max(1,Math.min(17,ranksMap[f.id]||17))-1]=f.id;});return arr;}
function ranksFromOrder(order){const r={};order.forEach((fid,i)=>{r[fid]=i+1;});return r;}
function setRank(ranksMap,factorId,newRank){newRank=Math.max(1,Math.min(17,Math.round(Number(newRank))||1));const order=orderFromRanks(ranksMap);const oldIdx=order.indexOf(factorId);if(oldIdx===-1)return ranksMap;order.splice(oldIdx,1);order.splice(newRank-1,0,factorId);return ranksFromOrder(order);}
const DEFAULT_WEIGHTS=ranksToWeights(DEFAULT_RANKS);
// Every race type starts from the same default rank order for now; go through the
// Set and Compare Race Angles matrix per race type to customize each one's ranking.
const PRESETS={custom:{...DEFAULT_WEIGHTS},stakes:{...DEFAULT_WEIGHTS},allowance:{...DEFAULT_WEIGHTS},claiming:{...DEFAULT_WEIGHTS},maiden:{...DEFAULT_WEIGHTS},sprint:{...DEFAULT_WEIGHTS},route:{...DEFAULT_WEIGHTS}};
// Live GiddyUp Presets published by the admin (InTheMoney) via the Angles
// matrix, loaded from Supabase at runtime. Falls back to the built-in
// default (equal rank order) for any race type that hasn't been published yet.
function presetWeightsFor(giddyupPresets,raceId){return(giddyupPresets&&giddyupPresets[raceId]&&giddyupPresets[raceId].weights)||PRESETS[raceId];}
function presetRanksFor(giddyupPresets,raceId){return(giddyupPresets&&giddyupPresets[raceId]&&giddyupPresets[raceId].ranks)||DEFAULT_RANKS;}
const EARNINGS_WEIGHT={custom:2,stakes:5,allowance:3,claiming:1,maiden:1,sprint:0,route:4};
// Specialist Angles: single-factor presets for people who bet purely on one thing
// (jockey stats, trainer stats, combo history, or earnings) rather than a blend.
function localDateStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function zeroedWeights(factorId){const w=Object.fromEntries(ALL_FACTORS.map(f=>[f.id,0]));w[factorId]=100;return w;}
const SPECIALIST_PRESETS=[
  {id:"jockey",label:"Jockey Only",icon:"🏇",weights:zeroedWeights("jockey")},
  {id:"trainer",label:"Trainer Only",icon:"🎯",weights:zeroedWeights("trainer")},
  {id:"combo",label:"Combo Only",icon:"🤝",weights:zeroedWeights("combo")},
  {id:"earnings",label:"Earnings Only",icon:"💰",weights:zeroedWeights("earnings")},
];
const RACE_TYPES=[
  {id:"custom",label:"Custom",icon:"⚙",color:"#6b7280"},
  {id:"stakes",label:"Stakes",icon:"🏆",color:"#c9a84c"},
  {id:"allowance",label:"Allowance",icon:"✅",color:"#4a9e6e"},
  {id:"claiming",label:"Claiming",icon:"🏷",color:"#4a7ec9"},
  {id:"maiden",label:"Maiden",icon:"🐎",color:"#9e4a9e"},
  {id:"sprint",label:"Sprint",icon:"⚡",color:"#c96b4a"},
  {id:"route",label:"Route",icon:"🛤",color:"#4a6b9e"},
];
const RACE_TYPE_ROWS=[["stakes","allowance","claiming","maiden"],["custom","sprint","route"]];
function raceTypeButton(rt,keyPrefix,onClick,isActive){
  return h("button",{key:keyPrefix+rt.id,onClick:()=>onClick(rt.id),style:{flex:1,padding:"8px 2px",borderRadius:10,border:isActive?"2px solid "+rt.color:"1.5px solid "+C.border,background:isActive?rt.color+"18":"#fff",cursor:"pointer"}},
    h("div",{style:{fontSize:14,marginBottom:1}},rt.icon),
    h("div",{style:{fontSize:8,fontWeight:700,color:isActive?rt.color:"#64748b",textTransform:"uppercase"}},rt.label));
}
function raceTypeRows(keyPrefix,onClick,isActiveFn){
  return RACE_TYPE_ROWS.map((row,ri)=>h("div",{key:keyPrefix+"row"+ri,style:{display:"flex",gap:4,marginBottom:ri<RACE_TYPE_ROWS.length-1?4:0}},
    row.map(id=>RACE_TYPES.find(rt=>rt.id===id)).map(rt=>raceTypeButton(rt,keyPrefix,onClick,isActiveFn(rt)))));
}
function AnglesPickerSheet({open,onClose,silksUser,activeRace,angleMode,activeSpecialist,giddyupPresets,onSelectGiddyUp,onSelectMyDNA,onSelectSpecialist}){
  if(!open)return null;
  const uName=silksUser&&silksUser.username?silksUser.username:"My";
  function pick(fn,id){return function(){fn(id);onClose();};}
  return h("div",{onClick:onClose,style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
    h("div",{onClick:e=>e.stopPropagation(),style:{width:"100%",maxWidth:480,background:"#fff",borderRadius:18,padding:"14px 16px 24px",maxHeight:"82vh",overflowY:"auto"}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
        h("div",{style:{fontSize:15,fontWeight:800,color:C.navy}},"Choose Your Angles"),
        h("button",{onClick:onClose,"aria-label":"Close",style:{border:"none",background:"none",fontSize:18,color:C.muted,cursor:"pointer",padding:4}},"✕")),
      h("div",{style:{fontSize:10,fontWeight:700,color:C.text,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}},"🐴 GiddyUp Presets"),
      h("div",{style:{marginBottom:14}},
        raceTypeRows("rk-gu-",id=>pick(onSelectGiddyUp,id)(),rt=>activeRace===rt.id&&activeSpecialist==='giddyup')),
      h("div",{style:{background:"rgba(201,168,76,0.10)",borderRadius:10,padding:"8px 8px 10px",marginBottom:14}},
        h("div",{style:{fontSize:10,fontWeight:700,color:C.text,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}},"⭐ "+uName+"'s DNA"),
        raceTypeRows("rk-me-",id=>pick(onSelectMyDNA,id)(),rt=>activeRace===rt.id&&angleMode==='custom'&&!activeSpecialist)),
      h("div",{style:{fontSize:10,fontWeight:700,color:C.text,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}},"🎯 Specialist Presets"),
      h("div",{style:{display:"flex",gap:4}},
        SPECIALIST_PRESETS.map(p=>h("button",{key:p.id,onClick:()=>pick(onSelectSpecialist,p)(),style:{flex:1,padding:"8px 2px",borderRadius:10,border:activeSpecialist===p.id?"2px solid "+C.gold:"1.5px solid "+C.border,background:activeSpecialist===p.id?"rgba(201,168,76,0.12)":"#fff",cursor:"pointer",textAlign:"center"}},
          h("div",{style:{fontSize:14,marginBottom:1}},p.icon),
          h("div",{style:{fontSize:8,fontWeight:700,color:activeSpecialist===p.id?C.gold:"#64748b"}},p.label))))));
}
const FC={speed:"#4a7ec9",form:"#c97a4a",jockey:"#c9a84c",trainer:"#4a9e6e",distance:"#9e4a4a",track:"#7a9e4a",post:"#9e4a9e",class:"#4a9e9e",days:"#b87333",weight:"#6b7280",workouts:"#e07070",equipment:"#70b0c0",pedigree:"#a87ab5",style:"#d4a07a",combo:"#7ab5a8",bias:"#b5a87a",earnings:"#2e8b57"};
const SILK_COLORS={
  1:{bg:"#c41e28",fg:"#ffffff"},2:{bg:"#ffffff",fg:"#1a1a1a"},3:{bg:"#1e3aaa",fg:"#ffffff"},
  4:{bg:"#e6c81e",fg:"#1a1a1a"},5:{bg:"#1e783c",fg:"#ffffff"},6:{bg:"#1a1a1a",fg:"#e6c81e"},
  7:{bg:"#e6781e",fg:"#1a1a1a"},8:{bg:"#e66ea0",fg:"#1a1a1a"},9:{bg:"#1ec8c8",fg:"#1a1a1a"},
  10:{bg:"#7a1ea0",fg:"#ffffff"},11:{bg:"#9e9e9e",fg:"#c41e28"},12:{bg:"#9ed61e",fg:"#1a1a1a"},
  13:{bg:"#7a4a28",fg:"#ffffff"},14:{bg:"#7a1e3c",fg:"#e6c81e"},15:{bg:"#b5a96a",fg:"#1a1a1a"},
  16:{bg:"#82c4e6",fg:"#c41e28"},17:{bg:"#1a2550",fg:"#ffffff"},18:{bg:"#1e5a3c",fg:"#e6c81e"},
  19:{bg:"#28327a",fg:"#c41e28"},20:{bg:"#d6196e",fg:"#e6c81e"},21:{bg:"#b48ad2",fg:"#1a2550"},
  default:{bg:"#6b7280",fg:"#ffffff"}
};
const C={gold:"#c9a84c",navy:"#1a2535",navy2:"#2d3f55",border:"#e2e8f0",muted:"#94a3b8",text:"#1a2535"};
// Light, welcoming backdrop for the sign-in / password-reset screens and
// the initial loading spinner — replaces the old dark forest-green
// gradient, which read as gloomy rather than inviting.
const AUTH_BG="linear-gradient(160deg,#eef6ea 0%,#f5f8f0 50%,#eaf5ef 100%)";
// Circuit is Evergreen Park only for now. When GiddyUp covers more than one
// track, this should become per-published-card data (e.g. returned by
// getPublishedDates) instead of a single hardcoded label.
const RACE_TRACK_NAME="Evergreen Park";
const GROUP_COLORS={core:C.gold,race:"#0f766e",deep:"#6d28d9"};
// Gold intensity ramp for factor ranks: darker = better. Single hue so it survives
// red/green colour deficiency, phone glare at the rail, and greyscale printing.
const RANK_TINT={
  1:{bg:"#efe0b0",bd:"1px solid #d9c179",fg:"#5c4a12",lbl:"#3d3108"},
  2:{bg:"#faf3dd",bd:"1px solid #ece0bb",fg:"#7a6420",lbl:"#4a3c12"},
  3:{bg:"#ffffff",bd:"1px solid #e8dcbd",fg:"#a07830",lbl:"#1e293b",stripe:"4px solid "+C.gold},
  0:{bg:"#ffffff",bd:"1px solid #eef2f6",fg:"#94a3b8",lbl:"#1e293b"},
  na:{bg:"#f8fafc",bd:"1px dashed #dfe6ee",fg:"#b0bcc9",lbl:"#94a3b8"}
};
function tintFor(rank){if(rank==null)return RANK_TINT.na;return RANK_TINT[rank]||RANK_TINT[0];}
// Near-tie detection. Rank shows the order but hides the gap: #1 and #2 look the
// same whether the split is 80-78 or 80-58. A coin marks the first case -- the top
// of this angle is inside the noise, so treat the ordering there as a coin flip.
// Most stats are 0-100 ratings on a shared scale, so 5 points is the default gap.
// Jockey and trainer are built as 50+win_pct, so their displayed points ARE win
// percentage -- a 5 point gap is a 5% jockey vs a 0% jockey, which is no tie at all.
const TIE_GAP={jockey:2,trainer:2};
const TIE_GAP_DEFAULT=5;
// Earnings ranks on dollars per start, not a 0-100 rating, so it needs a
// proportional band instead of an absolute one.
const TIE_GAP_EARNINGS_PCT=0.10;
function tieGapFor(factorId,bestVal){if(factorId==="earnings")return Math.abs(bestVal||0)*TIE_GAP_EARNINGS_PCT;return TIE_GAP[factorId]!=null?TIE_GAP[factorId]:TIE_GAP_DEFAULT;}
// A factor with identical values across the whole field separates nobody. It carries
// no information, so it is marked N/A and its weight is redistributed rather than
// handing every horse the same "#1".
function fieldHasVariance(horses,factorId){if(horses.length<2)return true;const v0=horses[0].stats[factorId]||0;for(let i=1;i<horses.length;i++){if((horses[i].stats[factorId]||0)!==v0)return true;}return false;}
function golfRank(horses,factorId){const sorted=[...horses].sort((a,b)=>(b.stats[factorId]||0)-(a.stats[factorId]||0));const ranks={};let i=0;while(i<sorted.length){const val=sorted[i].stats[factorId]||0;let j=i;while(j<sorted.length&&(sorted[j].stats[factorId]||0)===val)j++;for(let k=i;k<j;k++)ranks[sorted[k].number]=i+1;i=j;}return ranks;}
// Confidence thresholds: starts needed to be "fully trusted" per tier.
// CY/LY reach full confidence quickly (3 starts); Lifetime needs more (8) but
// is floored so it never gets fully ignored -- it's the fallback data source.
const EARNINGS_CONF_THRESH={cy:3,ly:3,car:8};
const EARNINGS_PRIORS={cy:0.5,ly:0.3,car:0.2};
const EARNINGS_CAR_FLOOR=0.3;
function computeEarningsRanks(horses){
  const eps=horses.map(hr=>{
    const e=hr.earnings||{};
    const starts_cy=e.cy_starts||0,starts_ly=e.ly_starts||0,starts_car=e.car_starts||0;
    return{
      number:hr.number,
      eps_cy:starts_cy>0?e.cy_earnings/starts_cy:null,
      eps_ly:starts_ly>0?e.ly_earnings/starts_ly:null,
      eps_car:starts_car>0?e.car_earnings/starts_car:null,
      starts_cy,starts_ly,starts_car
    };
  });
  const hasAnyData=eps.some(x=>x.eps_cy!==null||x.eps_ly!==null||x.eps_car!==null);
  const results=eps.map(hr=>{
    const conf_cy=Math.min(1,hr.starts_cy/EARNINGS_CONF_THRESH.cy);
    const conf_ly=Math.min(1,hr.starts_ly/EARNINGS_CONF_THRESH.ly);
    const conf_car=Math.min(1,hr.starts_car/EARNINGS_CONF_THRESH.car);
    // Zero out any tier with no actual data so it can't contribute (even at the floor).
    const rw_cy=hr.eps_cy!==null?EARNINGS_PRIORS.cy*conf_cy:0;
    const rw_ly=hr.eps_ly!==null?EARNINGS_PRIORS.ly*conf_ly:0;
    const rw_car=hr.eps_car!==null?EARNINGS_PRIORS.car*Math.max(conf_car,EARNINGS_CAR_FLOOR):0;
    const totalW=rw_cy+rw_ly+rw_car;
    let compositeEps=null,w_cy=0,w_ly=0,w_car=0;
    if(totalW>0){
      w_cy=rw_cy/totalW;w_ly=rw_ly/totalW;w_car=rw_car/totalW;
      compositeEps=w_cy*(hr.eps_cy||0)+w_ly*(hr.eps_ly||0)+w_car*(hr.eps_car||0);
    }
    return{number:hr.number,compositeEps,eps_cy:hr.eps_cy,eps_ly:hr.eps_ly,eps_car:hr.eps_car,
      starts_cy:hr.starts_cy,starts_ly:hr.starts_ly,starts_car:hr.starts_car,
      w_cy,w_ly,w_car};
  });
  // Horses with zero data anywhere get the field median composite instead of
  // an automatic last place -- no data means "unknown," not "worst."
  const known=results.filter(r=>r.compositeEps!==null).map(r=>r.compositeEps).sort((a,b)=>a-b);
  const median=known.length?(known.length%2?known[(known.length-1)/2]:(known[known.length/2-1]+known[known.length/2])/2):0;
  results.forEach(r=>{if(r.compositeEps===null)r.compositeEps=hasAnyData?median:0;});
  return results;
}

// ── RACE REPORT ──
// "We do the math, you read the race." These rules surface context the
// numeric score can't express — class trajectory, cold connections, barn
// intent — and where two signals genuinely disagree, both are shown rather
// than silently resolved. Pure functions over already-loaded horse data
// (pastStarts, jockeyMeet, trainer), so this is cheap enough to recompute
// live at render time rather than freezing it at publish.
const CLASS_RANK={"maiden claiming":1,"maiden":2,"claiming":3,"optional claiming":4,"allowance":5,"stakes":6};
function classRankOf(rt){return CLASS_RANK[(rt||"").toLowerCase().trim()]||2;}
function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function classFlag(horse,todayRaceType){
  const starts=horse.pastStarts||[];
  if(!starts.length)return null;
  const todayRank=classRankOf(todayRaceType);
  const recent=starts.slice(0,2);
  const avgRank=recent.reduce((s,p)=>s+classRankOf(p.raceType),0)/recent.length;
  const bestRecentStakes=starts.filter(p=>classRankOf(p.raceType)>=5).sort((a,b)=>classRankOf(b.raceType)-classRankOf(a.raceType))[0];

  if(bestRecentStakes&&todayRank<=3){
    return{horse:horse.number,name:horse.name,rule:"class_rise_stakes",polarity:"positive",strength:90,
      text:"Ran "+ordinal(bestRecentStakes.finishPosition)+" in a "+(bestRecentStakes.purse?("$"+bestRecentStakes.purse+" "):"")+"stakes"+(bestRecentStakes.daysAgo?(" ("+Math.round(bestRecentStakes.daysAgo/30)+" month"+(Math.round(bestRecentStakes.daysAgo/30)===1?"":"s")+" back)"):"")+" — tougher company than anything else in this field has seen."};
  }
  if(todayRank<avgRank){
    const lastFinish=recent[0].finishPosition;
    if(lastFinish&&lastFinish<=3){
      return{horse:horse.number,name:horse.name,rule:"class_drop_live",polarity:"positive",strength:70,
        text:"Dropping in class off a "+ordinal(lastFinish)+"-place finish — a live class drop, not a desperation move."};
    }
    if(recent[0].daysAgo&&recent[0].daysAgo<21){
      return{horse:horse.number,name:horse.name,rule:"class_drop_caution",polarity:"caution",strength:40,
        text:"Dropping in class off a beaten effort just "+recent[0].daysAgo+" days ago — worth checking for trouble in that trip before reading this as a positive move."};
    }
  }
  return null;
}

function coldJockeyModifier(horse){
  const jm=horse.jockeyMeet;
  if(!jm||jm.starts<10||jm.wins>0)return null;
  return "Caution: jockey "+horse.jockey+" is "+jm.wins+"-for-"+jm.starts+" this meet.";

// Same-trainer entries — pick by jockey win%, structured (not pre-formatted
// text) so the render layer isn't parsing its own generated sentence apart.
function barnConflicts(horses){
  const byTrainer={};
  horses.forEach(h=>{(byTrainer[h.trainer]=byTrainer[h.trainer]||[]).push(h);});
  const conflicts=[];
  Object.values(byTrainer).filter(g=>g.length>=2).forEach(group=>{
    const withPct=group.map(h=>({
      number:h.number,name:h.name,jockey:h.jockey,
      jPct:h.jockeyMeet?h.jockeyMeet.winPct:(h.liveJockey?h.liveJockey.win_pct:0)
    }));
    const sorted=[...withPct].sort((a,b)=>b.jPct-a.jPct);
    if(sorted[0].jPct===sorted[1].jPct)return;
    conflicts.push({rule:"barn_entry",strength:60,trainer:group[0].trainer,
      horses:group.map(h=>h.number),leader:sorted[0],others:sorted.slice(1)});
  });
  return conflicts;
}

function buildRaceReport(horses,raceType){
  const flags=[];
  horses.forEach(horse=>{
    const cf=classFlag(horse,raceType);
    if(cf){
      const cold=coldJockeyModifier(horse);
      if(cold)cf.caution=cold;
      flags.push(cf);
    }
  });
  const conflicts=barnConflicts(horses);
  // Only conflicts and class flags compete for the same 3 slots by strength —
  // a horse in a barn conflict can still surface its own class flag, since
  // the two describe different things (jockey assignment vs. class history),
  // not two versions of the same claim.
  return[...flags,...conflicts].sort((a,b)=>b.strength-a.strength).slice(0,3);

// Per-horse narrative tell — The Tell Report. Qualitative only, never
// feeds Angle Points. Returns {text, hasTell} for one horse.
function parseFurlongs(s){
  if(!s)return null;
  s=String(s).toLowerCase();
  if(s.indexOf("mile")>=0||/\bm\b/.test(s)){
    const whole=s.match(/(\d+)\s*(?:\d\/\d)?\s*m/);
    const frac=s.match(/(\d+)\s*\/\s*(\d+)/);

    if(!n){const only=s.match(/([\d.]+)/);n=only?parseFloat(only[1]):0;}
    return n?n*8:null;
  }
  const fm=s.match(/([\d.]+)\s*f/);
  if(fm)return parseFloat(fm[1]);
  const n=s.match(/([\d.]+)/);
  return n?parseFloat(n[1]):null;
}

// Diary photos were being stored as raw, uncompressed base64 straight from the
// camera/file picker. A single phone photo can be several MB that way, and
// localStorage is typically capped around 5-10MB total per site — so a save
// could silently blow the quota, throw inside a try/catch that swallowed the
// error, and vanish on next reload while looking like it had saved fine.
// This downsizes/re-compresses to a JPEG that stays legible for a race
// program or ticket photo but is realistically tens-to-low-hundreds of KB
// instead of multiple MB.
function compressImageDataUrl(dataUrl,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let width=img.width,height=img.height;
      if(width>maxDim||height>maxDim){
        if(width>height){height=Math.round(height*maxDim/width);width=maxDim;}
        else{width=Math.round(width*maxDim/height);height=maxDim;}
      }
      const canvas=document.createElement("canvas");
      canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,width,height);
      try{resolve(canvas.toDataURL("image/jpeg",quality));}catch(ex){reject(ex);}
    };
    img.onerror=reject;
    img.src=dataUrl;
  });
}
function tellForHorse(horse,horses,raceType,raceMeta){
  const notes=[];
  const cf=classFlag(horse,raceType);
  if(cf)notes.push({strength:cf.strength,text:cf.text});
  const barnMates=horses.filter(h=>h.trainer===horse.trainer&&h.number!==horse.number);
  if(barnMates.length){
    const jPct=h=>h.jockeyMeet?h.jockeyMeet.winPct:(h.liveJockey?h.liveJockey.win_pct:0);
    const mine=jPct(horse),best=Math.max(...barnMates.map(jPct));
    if(mine>best)notes.push({strength:65,text:"Same trainer as "+barnMates.map(h=>"#"+h.number).join("/")+" — this one carries the stronger jockey, a subtle sign the barn likes this one's chances better."});
  }
  const st=horse.stats||{};
  const starts=horse.pastStarts||[];
  if(st.workouts>=75)notes.push({strength:55,text:"Sharp recent workout pattern stands out — one of the stronger drills in the field heading into today."});
  const styleVals=horses.map(h=>(h.stats||{}).style||0);
  const maxStyle=Math.max(...styleVals);
  if(st.style===maxStyle&&st.style>0&&(styleVals.filter(v=>v===maxStyle).length===1)&&(maxStyle-[...styleVals].sort((a,b)=>b-a)[1]>=15))
    notes.push({strength:60,text:"Looks like the only true pace in this field — if nothing else presses, this one could control the race from the front."});
  if(st.combo>=75&&st.combo>(st.jockey||0)&&st.combo>(st.trainer||0))
    notes.push({strength:50,text:"This trainer/jockey combination has quietly outperformed what either name does alone."});
  const cold=coldJockeyModifier(horse);
  if(cold)notes.push({strength:45,text:cold});

  // Protected drop — ran allowance/optional claiming, never actually
  // entered for a claiming tag.
  const raceTypes=starts.map(p=>p.raceType);
  if(raceTypes.some(t=>t==="allowance"||t==="optional claiming")&&!raceTypes.some(t=>t==="claiming"||t==="maiden claiming"))
    notes.push({strength:55,text:"Has run in allowance or optional claiming company without ever being entered for a claiming tag — a protected horse, often spotted to win when it finally drops in."});

  // Layoff cycle — second/third start back off a break, using the gaps
  // between consecutive past starts.
  if(starts[0]&&starts[1]&&(starts[1].daysAgo-starts[0].daysAgo)>=60)
    notes.push({strength:45,text:"Second start back off a layoff — often the sharpest race in a trainer's typical form cycle."});
  else if(starts[0]&&starts[1]&&starts[2]&&(starts[0].daysAgo-starts[1].daysAgo)<45&&(starts[1].daysAgo-starts[2].daysAgo)>=60)
    notes.push({strength:40,text:"Third start off a layoff — some barns build deliberately toward this exact race."});

  // Pace collapse — several need-the-lead types entered, this one profiles
  // as a closer who could inherit the trip.
  const paceCount=horses.filter(h=>((h.stats||{}).style||0)>=70).length;
  if(paceCount>=3&&st.style<60)
    notes.push({strength:50,text:"Several need-the-lead types are entered today — if they contest the pace early, a closer like this one could get the run of the race."});

  // Class without speed — faced tougher company than the raw figures show.
  if((st.class||0)-(st.speed||0)>=15)
    notes.push({strength:45,text:"Been facing tougher company than the raw speed figures reflect — a class edge here more than a figure edge."});

  // Equipment rating well clear of the field.
  if(st.equipment>=80)
    notes.push({strength:35,text:"Equipment setup rates as one of the strongest in the field today."});

  // Live longshot trainer pattern — low-win barn, but today's horse
  // matches their known live signature (class drop + sharp works).
  if(horse.trainerMeet&&horse.trainerMeet.starts>=10&&horse.trainerMeet.winPct<15&&(st.class||0)>=70&&(st.workouts||0)>=75)
    notes.push({strength:40,text:"This barn doesn't win often, but the class drop and sharp works here match their known live-longshot pattern — worth a look at a price."});

  // Return to best distance — proven at today's trip, recent starts away
  // from it.
  const todayF=parseFurlongs(raceMeta&&raceMeta.distance);
  if(todayF){
    const goodAtToday=starts.some(p=>{const f=parseFurlongs(p.distance);return f&&Math.abs(f-todayF)<=0.5&&p.finishPosition&&p.finishPosition<=2;});
    const recentAway=starts.length>=2&&starts.slice(0,2).every(p=>{const f=parseFurlongs(p.distance);return f&&Math.abs(f-todayF)>1.5;});
    if(goodAtToday&&recentAway)
      notes.push({strength:50,text:"Has won or run second at today's distance before, then drifted away from it in recent starts — a return to a proven trip."});
  }

  // Surface change — switching onto a surface it's already shown ability on.
  const todaySurface=raceMeta&&raceMeta.surface;
  if(todaySurface&&starts[0]&&starts[0].surface&&starts[0].surface.toLowerCase()!==todaySurface.toLowerCase()){
    const provenOnToday=starts.some(p=>p.surface&&p.surface.toLowerCase()===todaySurface.toLowerCase()&&p.finishPosition&&p.finishPosition<=3);
    if(provenOnToday)
      notes.push({strength:45,text:"Switching to "+todaySurface+" today after running on "+starts[0].surface+" last out — has performed well on "+todaySurface+" before."});
  }

  // Hidden improving figures — speed figures trending up across recent
  // starts while the public prices off the last number alone.
  const figs=starts.slice(0,4).map(p=>p.speedFigure).filter(v=>v!=null).reverse();
  if(figs.length>=3&&figs.every((v,i)=>i===0||v>=figs[i-1])&&(figs[figs.length-1]-figs[0])>=4)
    notes.push({strength:50,text:"Speed figures have been climbing steadily across recent starts — the improving trend matters more here than the last-out number alone."});

  // Rider loyalty — same jockey stays aboard through a bad finish.
  if(starts[0]&&starts[1]&&starts[0].jockey&&starts[0].jockey===starts[1].jockey&&starts.slice(0,2).some(p=>p.finishPosition&&p.finishPosition>=4))

  if(horse.firstLasix)
    notes.push({strength:40,text:"First time on Lasix today — often brings a real physical improvement, especially in younger horses."});

  const troubleWords=["check","steadi","bump","box","clip","wide","block","stumbl"];
  const troubled=starts.slice(0,3).find(p=>p.comment&&p.finishPosition&&p.finishPosition>=4&&troubleWords.some(w=>p.comment.toLowerCase().indexOf(w)>=0));

  if(!notes.length)return{text:"The numbers Tell the story here.",hasTell:false};
  notes.sort((a,b)=>b.strength-a.strength);
  return{text:notes.slice(0,2).map(n=>n.text).join(" "),hasTell:true};
}

  useEffect(()=>{

  const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();

        h("button",{type:"button",onClick:nextMonth,style:{background:"transparent",border:"none",fontSize:18,cursor:"pointer",color:C.navy,padding:"4px 10px"}},"›")),
        !!markedDates[value]&&h("div",{style:{textAlign:"center",fontSize:12,fontWeight:700,color:"#a07830",letterSpacing:0.4,marginBottom:10,textTransform:"uppercase"}},RACE_TRACK_NAME),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}},
        ["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=>h("div",{key:d,style:{textAlign:"center",fontSize:10,fontWeight:700,color:C.muted,padding:"4px 0"}},d))),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}},
        cells.map((d,i)=>{
          if(d===null)return h("div",{key:"e"+i});
          const ds=dateStrFor(d),isSelected=ds===value,isToday=ds===todayStr,hasCard=!!markedDates[ds];
          return h("button",{key:ds,type:"button",onClick:()=>{onChange(ds);setOpen(false);},style:{position:"relative",padding:"5px 0",textAlign:"center",borderRadius:8,border:isSelected?"2px solid "+C.gold:"1px solid transparent",background:isSelected?"rgba(201,168,76,0.15)":isToday?"rgba(26,37,53,0.06)":"transparent",cursor:"pointer"}},
            h("div",{style:{display:"inline-flex",alignItems:"center",justifyContent:"center",width:26,height:26,borderRadius:"50%",background:hasCard?"rgba(201,168,76,0.28)":"transparent",color:hasCard?"#7a5b12":C.text,fontWeight:hasCard?800:600,fontSize:13}},d));
        })),
      h("div",{style:{display:"flex",alignItems:"center",gap:12,marginTop:14,paddingTop:14,borderTop:"1px solid "+C.border}},
        h("div",{style:{width:30,height:30,borderRadius:"50%",background:"rgba(201,168,76,0.28)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:800,color:"#7a5b12",flexShrink:0}},"5"),
        h("span",{style:{fontSize:15,color:C.text,fontWeight:600}},"= race day published"))));
}

function UploadTab({races,setRaces,setActiveTab,setHorses,setActiveRace,setWeights,setLocks,angleMode,silksUser,giddyupPresets}){
  const [drag,setDrag]=useState(false);
  const [status,setStatus]=useState("idle");
  const [errorMsg,setErrorMsg]=useState("");
  const [progress,setProgress]=useState("");
  const [analyzingId,setAnalyzingId]=useState(null);
  const fileRef=useRef(),cameraRef=useRef();
  const racesHeaderRef=useRef(null);
  // per-race "add page" refs stored as a map by race id
  const pageRefs=useRef({});

  function readFileToPage(file,callback){
    const reader=new FileReader();
    reader.onload=(e)=>{
      const dataUrl=e.target.result,base64=dataUrl.split(",")[1];
      const isPdf=file.type==="application/pdf"||file.name.toLowerCase().endsWith(".pdf");
      const mediaType=isPdf?"application/pdf":(file.type&&file.type.startsWith("image/")?file.type:"image/jpeg");
      callback({base64,mediaType,isPdf,fileName:file.name,preview:isPdf?null:dataUrl});
    };
    reader.readAsDataURL(file);
  }

  function addFiles(files){
    Array.from(files).forEach((file,i)=>{
      readFileToPage(file,(page)=>{
        setRaces(r=>{
          const raceNum=r.length+1+i;
          return[...r,{id:Date.now()+i,label:"Race "+raceNum,pages:[page],status:"ready"}];
        });
      });
    });
    setStatus("idle");
  }

  function addPageToRace(raceId,file){
    readFileToPage(file,(page)=>{
      setRaces(r=>r.map(rc=>rc.id===raceId?{...rc,pages:[...rc.pages,page],status:"ready"}:rc));
    });
  }

  function removePage(raceId,pageIdx){
    setRaces(r=>r.map(rc=>{
      if(rc.id!==raceId)return rc;
      const pages=rc.pages.filter((_,i)=>i!==pageIdx);
      return pages.length===0?null:{...rc,pages,status:"ready"};
    }).filter(Boolean).map((rc,i)=>({...rc,label:"Race "+(i+1)})));
  }

  function remove(id){
    setRaces(r=>{
      const f=r.filter(rc=>rc.id!==id);
      return f.map((rc,i)=>({...rc,label:"Race "+(i+1)}));
    });
  }

  function clearAll(){setRaces([]);setStatus("idle");setErrorMsg("");}

  function renameRace(id,newLabel){
    setRaces(r=>r.map(rc=>rc.id===id?{...rc,label:newLabel}:rc));
  }

  // ── MEET-RECORD BLEND ──
  // Blends the jockey's/trainer's current-meet record printed on the card
  // itself (jockeyMeet/trainerMeet, e.g. "(2-0-0-0) 0%") with circuit-wide
  // historical stats from Supabase. PRIOR_STRENGTH is how many "pseudo-starts"
  // of history count as equal weight to real meet starts — higher trusts
  // history more and reacts slower to a hot/cold meet.
  const MEET_BLEND_PRIOR_STRENGTH=12;

  function blendedWinPct(currentWins,currentStarts,historicalWinPct){
    const hWin=(typeof historicalWinPct==="number")?historicalWinPct:0;
    const priorWins=MEET_BLEND_PRIOR_STRENGTH*(hWin/100);
    const starts=currentStarts||0;
    if(starts===0 && hWin===0)return 0;
    return((currentWins||0)+priorWins)/(starts+MEET_BLEND_PRIOR_STRENGTH)*100;
  }

  async function analyzeOne(race){
    if(!race||!race.pages||!race.pages.length)return;
    setAnalyzingId(race.id);
    setStatus("reading");
    setErrorMsg("");
    try{
      const pageCount=race.pages.length;
      setProgress("Reading "+race.label+(pageCount>1?" ("+pageCount+" pages)":"")+"...");

      // Build content blocks — one block per page, then one instruction text block
      const contentArr=race.pages.map(pg=>
        pg.isPdf
          ?{type:"document",source:{type:"base64",media_type:"application/pdf",data:pg.base64}}
          :{type:"image",source:{type:"base64",media_type:pg.mediaType,data:pg.base64}}
      );
      const isMulti=pageCount>1;
      const meetRecordSchema=" Each horse's card also prints the trainer's and jockey's current-meet record right next to their names, formatted like '( 2-0-0-0 ) 0%' — that's (Starts-1st-2nd-3rd) then Win%. Extract this into each horse's object as jockeyMeet:{starts,wins,winPct} and trainerMeet:{starts,wins,winPct}, using the numbers exactly as printed (winPct as an integer, e.g. 17 not 0.17). If a horse's card doesn't show this line, omit jockeyMeet/trainerMeet for that horse rather than guessing. Each horse's card also prints age/sex and breeding info near the top of its entry (e.g. 'B. c. 3' or 'Ch. f. 4' followed by sire/dam/breeder or a state-bred designation). age is the horse's age as an integer parsed from that line (e.g. 3), or null if not printed. bred is the breeding location exactly as printed — usually a state or province abbreviation/name near the age line (e.g. 'Alberta-bred', 'KY', 'Ontario') — as a short string, or empty string if not printed. Do not guess age or bred from context; only extract what is explicitly printed. firstLasix is true only if the program explicitly marks this as the horse's first time racing on Lasix (often shown as 'L1' or noted in text near the horse's name on today's entry), otherwise false — do not infer this from a past-performance line. Each past-performance line also typically prints, for that specific past race: the distance run (e.g. '6f', '1 1/16m'), the surface (e.g. 'Dirt', 'Turf', 'Synthetic', 'AW'), the jockey who rode that day, and a speed figure (Beyer or track-specific number). Some programs also print a short trip/running-line comment for a past race (e.g. 'checked', 'steadied', '5 wide', 'bumped', 'boxed in', 'clipped heels'). Extract these into each pastStarts entry as distance, surface, jockey, speedFigure (a number, or null if not printed), and comment (the trip comment text as printed, or empty string if none) — but ONLY for the horse's 4 most recent starts (the ones nearest the top of its past performance lines). For any starts beyond the 4 most recent, still include date, raceType, purse, finishPosition, and daysAgo as before, but omit distance, surface, jockey, speedFigure, and comment for those older lines to keep the response a manageable size. Extract only what is explicitly printed for that specific line — never infer or carry a value forward from a different start.";
      const promptText=isMulti
        ?"You have been given "+pageCount+" files for the same race. One is a horse racing past performances card (DRF, Equibase, or similar). The others may include supplementary data such as speed figure reports, handicapping sheets, or other race-related documents from any provider. Use ALL files together to build the most complete and accurate picture of each horse — where hard numbers exist in any file (speed figures, jockey win %, trainer win %, pace figures etc.) prefer those over estimates. Return ONLY compact, minified JSON with no extra whitespace, indentation, or line breaks (this keeps large fields well under the token budget): {raceType:string,raceNumber:number,postTime:string,track:string,raceDistance:string,raceConditions:string,raceSurface:string,horses:[{number,name,jockey,trainer,odds,age,bred,firstLasix,jockeyMeet:{starts,wins,winPct},trainerMeet:{starts,wins,winPct},earnings:{cy_earnings,cy_starts,ly_earnings,ly_starts,car_earnings,car_starts},stats:{speed,form,jockey,trainer,distance,track,post,class,days,weight,workouts,equipment,pedigree,style,combo,bias},pastStarts:[{date,raceType,purse,finishPosition,daysAgo,distance,surface,jockey,speedFigure,comment}]}]}. raceNumber is the large race number printed on the card. postTime is the approximate post time exactly as printed (e.g. 3:15PM) or empty string. track is the track name if printed (e.g. Evergreen Park) or empty string. raceDistance is the race distance exactly as printed (e.g. '4 Furlongs' or '1 Mile') or empty string. raceSurface is the racing surface exactly as printed (e.g. 'Dirt', 'Turf', 'Synthetic', 'All Weather') or empty string if not printed. raceConditions is the race condition/eligibility line as printed, including any abbreviation code, purse, and age/sex/weight restrictions (e.g. '(MX) MAIDEN. Purse $6,800. For Maidens, Three Years Old and Upward. Three Year Olds, 124 Lbs; Older, 124 Lbs.') or empty string. Stats 0-100. pastStarts is each past-performance line printed for the horse, most recent first — raceType is one of 'stakes','allowance','claiming','maiden claiming','maiden','optional claiming' based on the condition text printed (e.g. 'Stk - 3YOSpring - 11k' is stakes, 'Mcl 8000' is maiden claiming, 'Msw 6800' or 'Mdn 6800' is maiden). purse is the dollar amount printed for that condition if shown, else null. finishPosition is the horse's placing in that start as an integer. daysAgo is approximate days between that start's date and today, computed from the printed date. If no past performance lines are printed for a horse (first-time starter), return an empty array."+meetRecordSchema
        :"Analyze this horse racing past performance sheet. Return ONLY compact, minified JSON with no extra whitespace, indentation, or line breaks (this keeps large fields well under the token budget): {raceType:string,raceNumber:number,postTime:string,track:string,raceDistance:string,raceConditions:string,raceSurface:string,horses:[{number,name,jockey,trainer,odds,age,bred,firstLasix,jockeyMeet:{starts,wins,winPct},trainerMeet:{starts,wins,winPct},earnings:{cy_earnings,cy_starts,ly_earnings,ly_starts,car_earnings,car_starts},stats:{speed,form,jockey,trainer,distance,track,post,class,days,weight,workouts,equipment,pedigree,style,combo,bias},pastStarts:[{date,raceType,purse,finishPosition,daysAgo,distance,surface,jockey,speedFigure,comment}]}]}. raceNumber is the large race number printed on the card. postTime is the approximate post time exactly as printed (e.g. 3:15PM) or empty string. track is the track name if printed (e.g. Evergreen Park) or empty string. raceDistance is the race distance exactly as printed (e.g. '4 Furlongs' or '1 Mile') or empty string. raceSurface is the racing surface exactly as printed (e.g. 'Dirt', 'Turf', 'Synthetic', 'All Weather') or empty string if not printed. raceConditions is the race condition/eligibility line as printed, including any abbreviation code, purse, and age/sex/weight restrictions (e.g. '(MX) MAIDEN. Purse $6,800. For Maidens, Three Years Old and Upward. Three Year Olds, 124 Lbs; Older, 124 Lbs.') or empty string. Stats 0-100. pastStarts is each past-performance line printed for the horse, most recent first — raceType is one of 'stakes','allowance','claiming','maiden claiming','maiden','optional claiming' based on the condition text printed (e.g. 'Stk - 3YOSpring - 11k' is stakes, 'Mcl 8000' is maiden claiming, 'Msw 6800' or 'Mdn 6800' is maiden). purse is the dollar amount printed for that condition if shown, else null. finishPosition is the horse's placing in that start as an integer. daysAgo is approximate days between that start's date and today, computed from the printed date. If no past performance lines are printed for a horse (first-time starter), return an empty array."+meetRecordSchema;
      contentArr.push({type:"text",text:promptText});

      // The Worker now streams the Anthropic response through as Server-Sent
      // Events instead of buffering the whole completion, so a big field
      // (20+ horses) doesn't sit on one idle connection long enough for
      // Cloudflare's edge to time it out with a 522/524. We read the stream
      // as it arrives and accumulate the text deltas into rawJsonText.
      let rawJsonText="";
      async function runStreamingRequest(){
        const resp=await fetch("https://giddyup-proxy.kleskun.workers.dev",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:32000,messages:[{role:"user",content:contentArr}]})});
        const contentType=resp.headers.get("content-type")||"";
        if(!contentType.includes("text/event-stream")||!resp.body){
          // Non-streaming path: error JSON from the Worker/Anthropic, or an
          // old cached Worker deploy still returning a plain buffered reply.
          const rawText=await resp.text();
          if(rawText.indexOf("error code: 524")>=0||rawText.indexOf("error code: 522")>=0){
            throw new Error("The analysis is timing out — this race may have more horses or history than usual. Try again, and if it keeps happening let Carm know.");
          }
          const data=JSON.parse(rawText);
          if(data.error)throw new Error(data.error.message);
          return data.content.map(c=>c.text||"").join("").trim();
        }
        const reader=resp.body.getReader();
        const decoder=new TextDecoder();
        let buffer="",acc="";
        while(true){
          const {value,done}=await reader.read();
          if(done)break;
          buffer+=decoder.decode(value,{stream:true});
          const lines=buffer.split("\n");
          buffer=lines.pop();
          for(const line of lines){
            const t=line.trim();
            if(!t.startsWith("data:"))continue;
            const jsonStr=t.slice(5).trim();
            if(!jsonStr||jsonStr==="[DONE]")continue;
            let evt;
            try{evt=JSON.parse(jsonStr);}catch(e){continue;}
            if(evt.type==="content_block_delta"&&evt.delta&&evt.delta.type==="text_delta"){
              acc+=evt.delta.text;
            }else if(evt.type==="message_delta"&&evt.delta&&evt.delta.stop_reason==="max_tokens"){
              throw new Error("The response was cut off because this field's data exceeded the token budget. Try again — if it keeps happening on this size of field, let Carm know so the request can be split into smaller batches.");
            }else if(evt.type==="error"){
              throw new Error((evt.error&&evt.error.message)||"Stream error");
            }
          }
        }
        return acc.trim();
      }
      for(let attempt=0;attempt<2;attempt++){
        try{
          rawJsonText=await runStreamingRequest();
          break;
        }catch(streamErr){
          if(attempt===0)continue;
          throw streamErr;
        }
      }
      // Large fields (20+ horses, lots of pastStarts text) occasionally
      // trip Claude into emitting a raw control character (an actual
      // newline/tab byte) inside a JSON string value instead of escaping it
      // as \n/\t — that corrupts JSON.parse from that point forward with
      // errors like "Bad control character in string literal" or "Expected
      // ',' or ']'". This walks the text tracking string boundaries and
      // escapes any stray control characters found inside a string literal,
      // leaving structural whitespace (outside strings) untouched.
      function sanitizeJsonControlChars(str){
        let out="",inString=false,escaped=false;
        for(let i=0;i<str.length;i++){
          const ch=str[i],code=str.charCodeAt(i);
          if(inString){
            if(escaped){out+=ch;escaped=false;continue;}
            if(ch==="\\"){out+=ch;escaped=true;continue;}
            if(ch==="\""){inString=false;out+=ch;continue;}
            if(code<0x20){
              if(ch==="\n")out+="\\n";
              else if(ch==="\r")out+="\\r";
              else if(ch==="\t")out+="\\t";
              else out+="\\u"+code.toString(16).padStart(4,"0");
              continue;
            }
            out+=ch;
          }else{
            if(ch==="\"")inString=true;
            out+=ch;
          }
        }
        return out;
      }
      const jsonMatch=rawJsonText.match(/\{[\s\S]*\}/);
      if(!jsonMatch)throw new Error("No JSON found in response");
      let parsed;
      try{
        parsed=JSON.parse(jsonMatch[0]);
      }catch(parseErr){
        parsed=JSON.parse(sanitizeJsonControlChars(jsonMatch[0]));
      }
      const rt=(parsed.raceType||"custom").toLowerCase().trim();
      const detectedRaceType=["stakes","allowance","claiming","maiden"].find(t=>rt.includes(t))||"custom";
      const allHorses=(parsed.horses||[]).map((hh,idx)=>({
        ...hh,
        number:parseInt(hh.number)||(idx+1),
        jockeyMeet:hh.jockeyMeet&&typeof hh.jockeyMeet.starts==="number"?hh.jockeyMeet:null,
        trainerMeet:hh.trainerMeet&&typeof hh.trainerMeet.starts==="number"?hh.trainerMeet:null,
        earnings:{cy_earnings:0,cy_starts:0,ly_earnings:0,ly_starts:0,car_earnings:0,car_starts:0,...(hh.earnings||{})},
        odds:hh.odds||"N/A",
        stats:{speed:70,form:70,jockey:70,trainer:70,distance:70,track:70,post:70,class:70,days:70,weight:70,workouts:70,equipment:70,pedigree:70,style:70,combo:70,bias:70,...(hh.stats||{})},
        pastStarts:Array.isArray(hh.pastStarts)?hh.pastStarts:[]
      }));
      if(!allHorses.length)throw new Error("No horses found.");
      setProgress("Found "+allHorses.length+" horses!");
      setProgress("Checking jockey/trainer history…");
      await Promise.all(allHorses.map(async hh=>{
        const [combo,jockeyStats,trainerStats]=await Promise.all([
          GiddyUpAuth.getComboStats(hh.trainer,hh.jockey),
          GiddyUpAuth.getJockeyStats(hh.jockey),
          GiddyUpAuth.getTrainerStats(hh.trainer)
        ]);
        if(combo){hh.stats.combo=Math.min(100,Math.round(50+combo.win_pct));hh.liveCombo=combo;}

        // JOCKEY — compute the raw blended win% and flag whether ANY real data
        // exists (meet starts this meet, or enough circuit history). Horses
        // with zero starts everywhere get filled in below via field average
        // instead of being scored here.
        const jockeyHasMeet=hh.jockeyMeet && typeof hh.jockeyMeet.starts==="number" && hh.jockeyMeet.starts>0;
        hh._jockeyHasData=!!(jockeyHasMeet || jockeyStats);
        hh._jockeyRawPct=blendedWinPct(jockeyHasMeet?hh.jockeyMeet.wins:0,jockeyHasMeet?hh.jockeyMeet.starts:0,jockeyStats?jockeyStats.win_pct:0);
        if(hh._jockeyHasData){
          hh.liveJockey=jockeyHasMeet
            ?{...(jockeyStats||{}),win_pct:hh._jockeyRawPct,meetStarts:hh.jockeyMeet.starts,meetWins:hh.jockeyMeet.wins,source:"blended"}
            :{...jockeyStats,source:"circuit"};
        }

        // TRAINER — same treatment as jockey above.
        const trainerHasMeet=hh.trainerMeet && typeof hh.trainerMeet.starts==="number" && hh.trainerMeet.starts>0;
        hh._trainerHasData=!!(trainerHasMeet || trainerStats);
        hh._trainerRawPct=blendedWinPct(trainerHasMeet?hh.trainerMeet.wins:0,trainerHasMeet?hh.trainerMeet.starts:0,trainerStats?trainerStats.win_pct:0);
        if(hh._trainerHasData){
          hh.liveTrainer=trainerHasMeet
            ?{...(trainerStats||{}),win_pct:hh._trainerRawPct,meetStarts:hh.trainerMeet.starts,meetWins:hh.trainerMeet.wins,source:"blended"}
            :{...trainerStats,source:"circuit"};
        }
      }));

      // ── FIELD-AVERAGE FALLBACK ──
      // A horse with zero starts everywhere (no meet record, not found in
      // circuit history — typically a shipper new to this circuit) does NOT
      // get scored at the 50-point floor. That floor is mathematically
      // unbeatable-from-below: every horse WITH real data scores >=50, so a
      // hard-coded 50 guarantees the no-data horse ranks at or near the
      // bottom on that factor every single time, regardless of how good the
      // horse actually is. Instead, missing-data horses get the average
      // win% of the other horses in THIS race who do have real data — i.e.
      // "assume average connections" rather than "assume worst connections."
      function fieldAverage(list,hasKey,pctKey){
        const withData=list.filter(h=>h[hasKey]);
        if(!withData.length)return 0;
        return withData.reduce((s,h)=>s+h[pctKey],0)/withData.length;
      }
      const jockeyFieldAvg=fieldAverage(allHorses,"_jockeyHasData","_jockeyRawPct");
      const trainerFieldAvg=fieldAverage(allHorses,"_trainerHasData","_trainerRawPct");

      allHorses.forEach(hh=>{
        const jPct=hh._jockeyHasData?hh._jockeyRawPct:jockeyFieldAvg;
        hh.stats.jockey=Math.min(100,Math.round(50+jPct));
        if(!hh._jockeyHasData){hh.liveJockey={win_pct:jPct,meetStarts:0,meetWins:0,source:"field-average"};}

        const tPct=hh._trainerHasData?hh._trainerRawPct:trainerFieldAvg;
        hh.stats.trainer=Math.min(100,Math.round(50+tPct));
        if(!hh._trainerHasData){hh.liveTrainer={win_pct:tPct,meetStarts:0,meetWins:0,source:"field-average"};}

        delete hh._jockeyHasData;delete hh._jockeyRawPct;
        delete hh._trainerHasData;delete hh._trainerRawPct;
      });
     setHorses(allHorses);
      setActiveRace(detectedRaceType);
      if(angleMode!=='custom'){
        setWeights({...presetWeightsFor(giddyupPresets,detectedRaceType)});
        setLocks(Object.fromEntries(ALL_FACTORS.map(f=>[f.id,true])));
      } else {
        const all=(silksUser&&silksUser.customAngles)||{};
        const slot=all[detectedRaceType];
        if(slot){const filled=fillMissingFactors(slot.weights,slot.locks);setWeights(filled.weights);setLocks(filled.locks);}
      }
      setRaces(r=>r.map(rc=>rc.id===race.id?{...rc,status:"analyzed",horseCount:allHorses.length,horses:allHorses,raceType:detectedRaceType,raceNumber:parsed.raceNumber||null,postTime:parsed.postTime||"",track:parsed.track||"",raceDistance:parsed.raceDistance||"",raceConditions:parsed.raceConditions||"",label:parsed.raceNumber?("Race "+parsed.raceNumber):rc.label,active:true}:{...rc,active:false}));
      setStatus("done");
      setTimeout(()=>setActiveTab("angles"),1200);
    }catch(err){
      setStatus("error");
      setErrorMsg(err.message||"Could not read program.");
    }
    setAnalyzingId(null);
  }

  // ── PUBLISHED DAY CARD (Supabase race_cards) ──
  const [pubStatus,setPubStatus]=useState("");
  const [pubDate,setPubDate]=useState(new Date().toLocaleDateString("en-CA"));
  const [loadDate,setLoadDate]=useState(new Date().toLocaleDateString("en-CA"));
  const isAdmin=silksUser&&GIDDYUP_ADMIN_USERNAMES.includes((silksUser.username||"").toLowerCase());
  function todayStr(){return new Date().toLocaleDateString("en-CA");}

  function viewCached(race){
    if(!race.horses||!race.horses.length)return;
    setHorses(race.horses);
    const rt=race.raceType||"custom";
    setActiveRace(rt);
    if(angleMode!=='custom'){
      setWeights({...presetWeightsFor(giddyupPresets,rt)});
      setLocks(Object.fromEntries(ALL_FACTORS.map(f=>[f.id,true])));
    } else {
      const all=(silksUser&&silksUser.customAngles)||{};
      const slot=all[rt];
      if(slot){const filled=fillMissingFactors(slot.weights,slot.locks);setWeights(filled.weights);setLocks(filled.locks);}
    }
    setRaces(r=>r.map(rc=>rc.id===race.id?{...rc,active:true}:{...rc,active:false}));
    setActiveTab("rankings");
  }

  async function publishTodayCard(){
    const analyzed=races.filter(r=>r.horses&&r.horses.length);
    if(!analyzed.length){setPubStatus("Nothing to publish — analyze at least one race first.");return;}

function silksScoreRace(picks,actual,raceNum,card,scoreKey){
  var field=picks.field,win=picks.win;
  var depth=SILKS_PICK_DEPTHS[picks.pickType||'superfecta']||4;
  var fieldPts=0,fieldHits=[];
  field.slice(0,depth).forEach(function(hh){if(hh!=null&&actual.includes(hh)){fieldPts+=5;fieldHits.push(hh);}});
  var sweep=depth===4&&fieldHits.length===4,sweepPts=sweep?10:0;
  var winHit=win!=null&&actual[0]!=null&&actual[0]===win,winPts=winHit?20:0;
  var exacta=depth>=2&&field[0]!=null&&actual[0]!=null&&field[0]===actual[0]&&field[1]!=null&&actual[1]!=null&&field[1]===actual[1];
  var trifecta=depth>=3&&exacta&&field[2]!=null&&actual[2]!=null&&field[2]===actual[2];
  var superfecta=depth>=4&&trifecta&&field[3]!=null&&actual[3]!=null&&field[3]===actual[3];
  var exactaPts=exacta?30:0,trifectaPts=trifecta?50:0,superfectaPts=superfecta?70:0;
  var exoticPts=exactaPts+trifectaPts+superfectaPts;
  var raceTotal=fieldPts+sweepPts+winPts+exoticPts;
  var streak=0;
  if(raceNum>1&&scoreKey&&card){
    var alive=true;
    var history=card[scoreKey]||{};
    for(var i=raceNum-1;i>=1;i--){
      var prev=history[i];
      if(!prev||prev.raceTotal===0){alive=false;break;}
    }
    if(alive&&raceTotal>0) streak=5;
  }
  return{fieldPts:fieldPts,fieldHits:fieldHits,sweepPts:sweepPts,winHit:winHit,winPts:winPts,exacta:exacta,trifecta:trifecta,superfecta:superfecta,exactaPts:exactaPts,trifectaPts:trifectaPts,superfectaPts:superfectaPts,exoticPts:exoticPts,raceTotal:raceTotal,streak:streak,actual:actual,picks:picks};
}
function silksZeroScore(actual){
  return {fieldPts:0,fieldHits:[],sweepPts:0,winHit:false,winPts:0,exacta:false,trifecta:false,superfecta:false,exactaPts:0,trifectaPts:0,superfectaPts:0,exoticPts:0,raceTotal:0,streak:0,actual:actual,picks:null};

// ── VENUE PORTAL DETECTION ───────────────────────────────────────
// giddyupsilks.app/<slug> (e.g. /brewhouse) tags signups with the venue
// they came through. Generic by design — any outlet can get a portal at
// /<their-slug> with zero code changes, just a row in venue_portals.
// Captured once per session into sessionStorage so it survives the
// splash → signup navigation but doesn't leak into unrelated sessions.
// If we landed here via the 404.html redirect shim (i.e. the person's
// original URL had no literal file, like /brewhouse), restore that path
// in the address bar before anything below reads window.location — this
// keeps getVenueSlugFromPath() working exactly as if GitHub Pages had
// served this file directly at that path.
(function restoreRedirectedPath(){
  const redirected=sessionStorage.getItem("giddyup_redirect_path");
  if(redirected){
    sessionStorage.removeItem("giddyup_redirect_path");
    if(redirected!==window.location.pathname){
      window.history.replaceState(null,"",redirected+window.location.search+window.location.hash);
    }
  }
})();
const GIDDYUP_RESERVED_SLUGS=["index.html","play.html","learn.html","manifest.json","manifest-play.json","giddyup-auth.js"];
function getVenueSlugFromPath(){
  const seg=window.location.pathname.replace(/^\/+|\/+$/g,"").split("/")[0].toLowerCase();
  if(!seg||GIDDYUP_RESERVED_SLUGS.includes(seg))return null;
  return seg;
}
(function captureVenueSlug(){
  const slug=getVenueSlugFromPath();
  if(slug){
    sessionStorage.setItem("giddyup_venue",slug);
  }else{
    // Plain giddyupsilks.app load — clear any venue tag left over from a
    // previous /slug visit earlier in this browser session, so the
    // generic splash and generic (unattributed) signups stay generic.
    sessionStorage.removeItem("giddyup_venue");
  }
})();

// give any future venue the same branded splash + message center —
// no other code changes needed. Update the `messages` array any time
// specials/dates change; takes effect on next deploy.

  brewhouse:{

}

function GiddyUp(){
  const SESSION_KEY='giddyup_silks_session';
  const SESSION_MAX_AGE=20*60*60*1000; // ~20 hours — roughly one racing day
  const [persisted]=useState(()=>{
    try{
      const raw=localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      const data=JSON.parse(raw);
      if(!data||!data.ts||(Date.now()-data.ts)>SESSION_MAX_AGE) return null;
      return data;
    }catch(e){return null;}
  });
  const urlTab=new URLSearchParams(window.location.search).get('tab');
const [weights,setWeights]=useState({...PRESETS.custom});
  const [locks,setLocks]=useState(()=>Object.fromEntries(ALL_FACTORS.map(f=>[f.id,true])));
  const [activeRace,setActiveRace]=useState(()=>(persisted&&persisted.activeRace)||"custom");
  const [angleMode,setAngleMode]=useState('giddyup');
  const [activeTab,setActiveTab]=useState(()=>urlTab||(persisted&&persisted.activeTab)||"upload");
  useEffect(()=>{window.scrollTo({top:0,left:0,behavior:"auto"});},[activeTab]);
  const [races,setRaces]=useState(()=>(persisted&&persisted.races)||[]);
  const [horses,setHorses]=useState(()=>(persisted&&persisted.horses)||[]);
  const [scratched,setScratched]=useState(()=>(persisted&&persisted.scratched)||{});
  const [showSplash,setShowSplash]=useState(!urlTab&&!(persisted&&persisted.races&&persisted.races.length>0));

  // ── Auth state (Supabase) ──
  const [silksUser,setSilksUser]=useState(null);
  const [authMode,setAuthMode]=useState('login'); // 'login' | 'register'
  const [authChecked,setAuthChecked]=useState(false);
  // Detects landing here via a "reset your password" email link. Supabase
  // parses the recovery token out of the URL and opens a temporary
  // recovery session, firing a PASSWORD_RECOVERY auth event — checked
  // synchronously from the URL hash too, since the event can fire before
  // this component finishes mounting and subscribing.
  const [recoveryMode,setRecoveryMode]=useState(()=>/type=recovery/.test(window.location.hash));
  useEffect(()=>{
    if(GiddyUpAuth&&typeof GiddyUpAuth.onPasswordRecovery==='function'){
      GiddyUpAuth.onPasswordRecovery(()=>setRecoveryMode(true));
    }
  },[]);
  function handleRecoverySet(user){
    window.history.replaceState(null,"",window.location.pathname+window.location.search);
    setRecoveryMode(false);
    if(user){setSilksUser(user);setShowSplash(true);}
  }
  // ── Live GiddyUp Presets (admin-published, replaces hardcoded PRESETS) ──
  const [giddyupPresets,setGiddyupPresets]=useState({});
  useEffect(()=>{
    if(!silksUser)return;
    GiddyUpAuth.getGiddyUpPresets().then(setGiddyupPresets);
  },[silksUser&&silksUser.id]);

useEffect(()=>{
    (async()=>{
      const session=await GiddyUpAuth.getSession();
      if(session&&session.user){
        const profile=await GiddyUpAuth.getProfile(session.user.id);
       const customAnglesAll=normalizeCustomAngles(profile&&profile.custom_angles);
        setSilksUser({id:session.user.id,username:profile?profile.username:'',email:session.user.email,city:profile?profile.city:'',realName:profile?profile.real_name:'',customAngles:customAnglesAll});
        // Login loads the user's saved DNA into silksUser so the Angles picker can
        // offer it, but it must NOT change the active mode. angleMode stays 'giddyup'
        // so every race opens on the GiddyUp preset for its detected type; the picker
        // is the only thing that switches to DNA.
      }
      setAuthChecked(true);
    })();
  },[]);

  // ── Persist races/rankings/session so returning from GiddyUp Play doesn't lose your loaded card ──
  useEffect(()=>{
    try{
      localStorage.setItem(SESSION_KEY,JSON.stringify({races,horses,scratched,activeRace,activeTab,ts:Date.now()}));
    }catch(e){}
  },[races,horses,scratched,activeRace,activeTab]);

 async function handleSilksLogout(){

    setRaces([]);
    setHorses([]);

    try{localStorage.removeItem(SESSION_KEY);}catch(e){}
  }

async function handleSaveAngles(raceType,currentWeights,currentLocks,currentRanks){
    if(!silksUser) return false;
    const merged={...(silksUser.customAngles||{}),[raceType]:{weights:currentWeights,locks:currentLocks,ranks:currentRanks}};
    const result=await GiddyUpAuth.saveCustomAngles(silksUser.id,merged);
    if(result.success){
      setSilksUser(u=>({...u,customAngles:merged}));
      return true;

if(!silksUser)return h(AuthScreen,{mode:authMode,setMode:setAuthMode,onAuthed:user=>{
